<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PDCW History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/styles.css"/>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" defer></script>
  <script defer src="/static/history.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">PDCW History</div>
      <div class="controls">
        <a href="/" class="btn">Live View</a>
      </div>
    </header>

    <div class="content">
      <aside class="left">
        <div class="panel">
          <div class="panel-header">Controls</div>
          <div class="history-controls">
            <label>Start: <input type="datetime-local" id="start-time"></label>
            <label>End: <input type="datetime-local" id="end-time"></label>
            <label>Max Points: <input type="number" id="limit" value="1000" min="100"></label>
            <button id="plot-btn" class="btn">Plot</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header">
            <div>Channels</div>
            <div class="panel-actions">
              <button id="select-all" class="btn btn-small">All</button>
              <button id="select-none" class="btn btn-small">None</button>
            </div>
          </div>
          <div id="channel-list" class="channel-list"></div>
        </div>
      </aside>

      <main class="right">
        <div id="chart" class="chart"></div>
        <div class="chart-actions">
            <button id="save-csv-btn" class="btn">Save as CSV</button>
            <button id="save-plot-btn" class="btn">Save as Plot</button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
